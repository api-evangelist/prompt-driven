name: Prompt Driven
description: >-
  Prompt Driven (PDD) is the company behind Prompt-Driven Development, a
  prompt-native programming system in which .prompt files are the human-authored
  source language and traditional code (Python, TypeScript, Go, and others) is
  generated as an artifact. PDD ships as a single open-source Python CLI, pdd-cli,
  plus a local web interface, and offers agentic commands that implement GitHub
  issues automatically through a Define -> Generate -> Verify -> Test -> Update
  cycle. Positioned as "The Last Programming Language," the project is MIT-licensed,
  maintained by Greg Tanaka, and backed by 500 Global. It is a developer tool
  rather than a hosted API — there is no public REST/GraphQL API, OpenAPI spec, or
  MCP server; the developer surface is the CLI and its GitHub repository.
